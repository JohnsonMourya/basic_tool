{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% if title %}
    <title>{{ title}}</title>
    {% else %}
    <title>Daily Tools</title>
    {% endif %}
    <link rel="stylesheet" href="{% static "homeapp/bootcss/bootstrap.min.css" %}">
</head>
<body>
    <nav class="navbar navbar-expand-md  bg-body-tertiary">
        <div class="container-fluid mt-2 mx-5">
            <a class="navbar-brand" href="/">
                <span class="navbar-brand mb-0 h1">Daily Tools</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle='collapse' data-bs-target='#navbarNav' aria-controls="navbarNav" aria-expands="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div id="navbarNav" class="collapse navbar-collapse">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="">Dasboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="">Pricing</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="">About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    {% block content %}
    {% endblock %}
</body>
<script src="{% static "homeapp/bootjs/bootstrap.bundle.js" %}"></script>
</html>
