{% extends "homeapp/base.html" %}
{% load static %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7 col-xl-6">

      <h1 class="h4 mb-3">Calendar</h1>

      <div class="card border-0 shadow-sm">
        <div class="card-body p-3">

          <div class="d-flex align-items-center justify-content-between mb-3">
            <button class="btn btn-outline-secondary btn-sm" id="prevBtn">&larr;</button>
            <span class="fw-medium" id="calMonth"></span>
            <select class="form-select form-select-sm" id="calYear" style="width:auto;"></select>
            <button class="btn btn-outline-secondary btn-sm" id="nextBtn">&rarr;</button>
            <button class="btn btn-outline-secondary btn-sm ms-2" id="todayBtn">Today</button>
          </div>

          <div class="cal-grid" id="calGrid"></div>

        </div>
      </div>

      <div class="card border-0 shadow-sm mt-3" id="eventsContainer">
        <div class="card-body p-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="fw-medium small" id="eventsHeader"></span>
          </div>
          <div id="eventsList"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<style>
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}
.cal-weekday {
  text-align: center;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--bs-secondary-color, #6c757d);
  padding: 0.4rem 0;
}
.cal-day {
  text-align: center;
  padding: 0.5rem 0;
  border-radius: 0.4rem;
  cursor: pointer;
  position: relative;
  transition: background-color 0.15s;
}
.cal-day:hover {
  background-color: var(--bs-tertiary-bg, #f0f0f0);
}
.cal-day-num {
  font-size: 0.9rem;
  width: 21px;
  display: inline-block;
}
.cal-selected .cal-day-num {
  box-shadow: 0 0 0 2px #fff;
  border-radius: 50%;
}
.cal-today .cal-day-num {
  background-color: var(--bs-primary, #0d6efd);
  color: #fff;
  border-radius: 50%;
  display: inline-block;
  width: 1.8rem;
  line-height: 1.8rem;
}
.event-row {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
  padding: 0.4rem 0;
  border-bottom: 1px solid var(--bs-border-color, #eee);
  font-size: 0.85rem;
}
.event-row:last-child {
  border-bottom: none;
}
.event-year {
  font-weight: 700;
  color: #e63946;
  white-space: nowrap;
  min-width: 3.2rem;
}
.event-text {
  flex: 1;
  line-height: 1.4;
}
.event-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.6rem;
  height: 1.6rem;
  border: 1px solid var(--bs-border-color, #ccc);
  border-radius: 0.3rem;
  text-decoration: none;
  color: var(--bs-body-color, #333);
  flex-shrink: 0;
  margin-top: 0.1rem;
  transition: background-color 0.15s;
}
.event-link:hover {
  background-color: var(--bs-tertiary-bg, #f0f0f0);
}
</style>
{% endblock %}

{% block extra_js %}
<script src="{% static 'calender/js/calender.js' %}"></script>
{% endblock %}
