{% extends "homeapp/base.html" %}
{% load static %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-xl-5 text-center">

      <h1 class="h4 mb-4 fw-normal">Stopwatch</h1>

      <div class="display-1 fw-light font-monospace mb-4 lh-1" id="timeDisplay">
        00:00.00
      </div>

      {% comment %}
      <div class="d-flex justify-content-center gap-2 mb-4">
        <button class="btn btn-outline-secondary" id="subMinBtn" title="Subtract minute">−1 min</button>
        <button class="btn btn-outline-secondary" id="addMinBtn" title="Add minute">+1 min</button>
      </div>
      {% endcomment %}

      <div class="d-flex justify-content-center gap-2 mb-4">
        <button class="btn btn-success rounded-circle p-3 d-flex align-items-center justify-content-center" id="playBtn" title="Start" style="width:56px;height:56px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
            <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/>
          </svg>
        </button>
        <button class="btn btn-outline-secondary rounded-circle p-3 d-flex align-items-center justify-content-center" id="lapBtn" title="Lap" disabled style="width:56px;height:56px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
            <path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V5h16v4H2v5a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-1h-3v-1h3V8H0V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5z"/>
          </svg>
        </button>
        <button class="btn btn-outline-secondary rounded-circle p-3 d-flex align-items-center justify-content-center" id="stopBtn" title="Stop" style="width:56px;height:56px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
            <path d="M3.5 2A1.5 1.5 0 0 0 2 3.5v9A1.5 1.5 0 0 0 3.5 14h9a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 12.5 2h-9z"/>
          </svg>
        </button>
        <button class="btn btn-outline-secondary rounded-circle p-3 d-flex align-items-center justify-content-center" id="resetBtn" title="Reset" style="width:56px;height:56px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M8 3a5 5 0 1 1-4.546 2.914.5.5 0 0 1 .908-.417A4 4 0 1 0 8 4a4 4 0 0 0-3.6 2.2.5.5 0 0 1-.9-.4A5 5 0 0 1 8 3z"/>
            <path fill-rule="evenodd" d="M4.5 2.5a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1H4V3a.5.5 0 0 1 .5-.5z"/>
          </svg>
        </button>
      </div>

      <div id="lapSection" class="d-none mt-3">
        <div class="d-flex justify-content-between align-items-center px-4 py-1 small fw-medium text-secondary-emphasis border-bottom">
          <span>Lap</span>
          <span>Lap Time</span>
          <span class="d-flex align-items-center gap-2">
            Total Time
          </span>
        </div>
        <div id="lapList"></div>
        <div class="justify-content-center">
          <button class="btn btn-sm btn-outline-secondary py-0 px-2" id="clearLapsBtn" title="Clear laps">Clear</button>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'stopwatch/js/stopwatch.js' %}"></script>
{% endblock %}
