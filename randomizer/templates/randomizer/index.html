{% extends "homeapp/base.html" %}
{% load static %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7 col-xl-6">

      <h1 class="h4 mb-3">Randomizer</h1>

      <div class="btn-group mb-4 w-100" role="group">
        <button class="btn btn-outline-secondary mode-btn active" data-mode="number">Number</button>
        <button class="btn btn-outline-secondary mode-btn" data-mode="coin">Coin</button>
        <button class="btn btn-outline-secondary mode-btn" data-mode="picker">Picker</button>
      </div>

      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">

          <div id="section-number" class="mode-section">
            <div class="row g-2 mb-3">
              <div class="col">
                <label class="form-label small">Min</label>
                <input type="number" class="form-control" id="numMin" value="1">
              </div>
              <div class="col">
                <label class="form-label small">Max</label>
                <input type="number" class="form-control" id="numMax" value="100">
              </div>
            </div>
            <button class="btn btn-primary w-100 mb-3" id="pickNumberBtn">Pick Random Number</button>
            <div class="text-center">
              <div class="fs-1 fw-bold" id="numResult">—</div>
            </div>
          </div>

          <div id="section-coin" class="mode-section d-none">
            <div class="text-center py-2">
              <div id="coin" class="coin mx-auto mb-3">?</div>
              <button class="btn btn-primary" id="flipBtn">Flip Coin</button>
              <div class="fs-5 fw-bold mt-3" id="coinResult"></div>
            </div>
          </div>

          <div id="section-picker" class="mode-section d-none">
            <label class="form-label small">Enter items</label>
            <textarea class="form-control font-monospace" id="pickerInput" rows="4" placeholder="apple, banana, cherry, date">apple, banana, cherry, date</textarea>
            <div class="d-flex justify-content-between align-items-center mt-1 mb-3">
              <div class="small text-secondary-emphasis" id="itemCount">4 items</div>
              <div class="small text-secondary-emphasis">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" class="me-1"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/><path d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533L8.93 6.588zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"/></svg>
                Separate with commas. Use <code>-</code> for spaces.
              </div>
            </div>

            <div class="btn-group mb-3 w-100" role="group">
              <button class="btn btn-outline-info picker-btn active" data-picker="shuffle">Shuffler</button>
              <button class="btn btn-outline-info picker-btn" data-picker="spin">Spin Wheel</button>
              <button class="btn btn-outline-info picker-btn" data-picker="drop">Drop Lottery</button>
            </div>

            <div id="picker-shuffle" class="picker-section">
              <button class="btn btn-primary w-100 mb-2" id="shuffleBtn">Shuffle</button>
            </div>
            <div id="picker-spin" class="picker-section d-none">
              <button class="btn btn-primary w-100 mb-2" id="spinBtn">Spin</button>
            </div>
            <div id="picker-drop" class="picker-section d-none">
              <button class="btn btn-primary w-100 mb-2" id="dropBtn">Drop</button>
            </div>

            <div id="pickerResult" class="mt-2"></div>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

<style>
.coin {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: #ffc107;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  font-weight: bold;
  transition: background-color 0.3s;
}
.flip-anim {
  animation: flipCoin 0.6s ease-in-out;
}
@keyframes flipCoin {
  0%   { transform: rotateY(0) scale(1); }
  25%  { transform: rotateY(360deg) scale(0.8); }
  50%  { transform: rotateY(720deg) scale(1.1); }
  75%  { transform: rotateY(900deg) scale(0.9); }
  100% { transform: rotateY(1080deg) scale(1); }
}
.spin-item.highlight,
.drop-item.highlight {
  background-color: var(--bs-primary-bg-subtle, #cfe2ff);
  color: var(--bs-primary-text-emphasis, #052c65);
  font-weight: 600;
}
</style>
{% endblock %}

{% block extra_js %}
<script src="{% static 'randomizer/js/randomizer.js' %}"></script>
{% endblock %}
